{% extends "dash.html" %}

{% block content %}
<div style="max-width:900px; margin:auto; font-family:Arial, sans-serif;">
    <h1 style="text-align:center; margin-bottom:30px;">AI Environmental Report: {{ plot.name }}</h1>

    {% if error %}
        <p style="color:red; text-align:center;">{{ error }}</p>
    {% else %}
        <section style="margin-bottom:30px; padding:20px; border:1px solid #ddd; border-radius:10px; background:#f7f9fc;">
            <h2 style="border-bottom:2px solid #aaa; padding-bottom:5px;">AI-Generated Professional Report</h2>
            <p style="white-space:pre-line; line-height:1.6;">{{ ai_report }}</p>
        </section>

<section style="margin-bottom:30px; padding:20px; border:1px solid #ccc; border-radius:10px; background:#eef2f7;">
    <h2 style="border-bottom:2px solid #888; padding-bottom:5px;">Raw GEE Metrics</h2>
    <pre style="background:#f0f4ff; padding:15px; border-radius:8px; overflow-x:auto;">
{{ gee_data_json|safe }}
    </pre>
</section>


        <section style="margin-bottom:30px; padding:20px; border:1px solid #bbb; border-radius:10px; background:#fdf6e3;">
            <h2 style="border-bottom:2px solid #999; padding-bottom:5px;">Plot Region</h2>
            <p>{{ region }}</p>
        </section>
    {% endif %}
</div>
{% endblock %}
