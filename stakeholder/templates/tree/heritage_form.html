{% extends "dash.html" %}
{% block content %}
<style>
  .heritage-form-wrapper {
    max-width: 520px;
    margin: 40px auto;
    padding: 25px;
    background-color: #191a19;
    border: 2px solid #2e4d2e;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.06);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .heritage-form-wrapper h2 {
    text-align: center;
    color: #1f3a1f;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .back-button-container {
    max-width: 520px;
    margin: 0 auto 15px auto;
    text-align: left;
  }

  .back-button {
    display: inline-block;
    font-size: 0.85rem;
    text-decoration: none;
    color: #2e4d2e;
    background-color: #e4f0e4;
    padding: 7px 13px;
    border: 1px solid #2e4d2e;
    border-radius: 6px;
    transition: background-color 0.2s ease-in-out;
    font-weight: 500;
  }

  .back-button:hover {
    background-color: #cfe2cf;
    text-decoration: none;
    color: #1b321b;
  }

  .heritage-form-wrapper form {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #2d4d2d;
    margin-bottom: 5px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    font-size: 0.85rem;
    padding: 8px 10px;
    border: 1px solid #2d4d2d;
    border-radius: 5px;
    background-color: #f9fff9;
    color: #1d2e1d;
  }

  .heritage-form-wrapper button[type="submit"] {
    background-color: #2e4d2e;
    border: none;
    font-weight: bold;
    font-size: 1rem;
    padding: 10px 18px;
    margin-top: 10px;
    border-radius: 6px;
    color: white;
    width: 100%;
    transition: background 0.2s ease-in-out;
    text-transform: uppercase;
  }

  .heritage-form-wrapper button:hover {
    background-color: #3d6a3d;
  }
</style>

<div class="back-button-container">
  <a href="{% url 'tree_create-m' %}" class="back-button">↩️ Back</a>
</div>

<div class="heritage-form-wrapper">
  <h2>Add New Heritage Site</h2>

  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
          <small class="form-text text-muted">{{ field.help_text }}</small>
        {% endif %}
        {% for error in field.errors %}
          <div class="text-danger">{{ error }}</div>
        {% endfor %}
      </div>
    {% endfor %}
    <button type="submit">💾 Save</button>
  </form>
</div>
{% endblock %}
