{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Delete Monitoring Record</h2>
  <p>Are you sure you want to delete this record for
    <strong>{{ object.plot.name }}</strong> on
    <strong>{{ object.date_monitored }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'monitoring-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
