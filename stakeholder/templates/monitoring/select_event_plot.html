{% extends 'dash.html' %}
{% block content %}
<div class="container my-4">
  <h3>Select Planting Event for Monitoring</h3>
  <form method="post">
    {% csrf_token %}
    <ul class="list-group">
      {% for event in events %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ event.name }} ({{ event.date_planted }})
        <button type="submit" name="event_id" value="{{ event.id }}" class="btn btn-success btn-sm">Monitor</button>
      </li>
      {% endfor %}
    </ul>
    <button type="submit" class="btn btn-secondary mt-3">Skip Event Monitoring</button>
  </form>
</div>
{% endblock %}
