{% extends "dash.html" %}
{% load static %}
{% block content %}
<!-- ✅ Include jQuery & Select2 CSS/JS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
  .select-event-container {
    max-width: 600px;
    margin: 3rem auto;
    padding: 2rem;
    background-color: #0b0f0b;
    border: 2px solid #2a2a2a;
    border-radius: 10px;
    box-shadow: 0 0 25px rgba(0, 255, 100, 0.2);
    color: #d0ffd0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .select-event-container h2 {
    color: #91ffa0;
    font-size: 1.8rem;
    margin-bottom: 1.5rem;
    text-align: center;
    border-bottom: 1px solid #2f2f2f;
    padding-bottom: 0.5rem;
  }

  .select-event-container form {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .select-event-container select,
  .select-event-container input,
  .select-event-container button {
    padding: 0.6rem 1rem;
    background-color: #121812;
    color: #b2ffb2;
    border: 1px solid #3f3f3f;
    border-radius: 6px;
    font-size: 1rem;
  }

  .select-event-container select:focus,
  .select-event-container input:focus {
    outline: none;
    border-color: #76ff76;
    background-color: #182818;
  }

  .select-event-container button {
    background-color: #1f3f1f;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .select-event-container button:hover {
    background-color: #3a7f3a;
    color: white;
  }

  .back-link {
    display: inline-block;
    margin-top: 1.5rem;
    color: #88cc88;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.2s ease;
  }

  .back-link:hover {
    color: #ffffff;
  }
</style>

<div class="select-event-container">
  <h2>🌱 Select Planting Event to Monitor</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Next →</button>
  </form>
  <a href="{% url 'monitored_tree_list-d' %}" class="back-link">← Back to Monitoring List</a>
</div>

<!-- ✅ Apply Select2 to all dropdowns -->
<script>
  $(document).ready(function () {
    $('select').select2({
      width: '100%',
      theme: 'classic',
      placeholder: "Select an event...",
      allowClear: true
    });
  });
</script>
{% endblock %}
