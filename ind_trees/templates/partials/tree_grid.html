{% if latest_trees %}
  <div class="row g-4" id="tree-cards">
    {% for tree in latest_trees %}
      <div class="col-md-6 col-lg-4">
        <div class="card tree-card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
          {% if tree.images.first %}
            <img src="{{ tree.images.first.image.url }}" class="card-img-top" alt="{{ tree.name }}" style="height: 220px; object-fit: cover;">
          {% else %}
            <img src="https://via.placeholder.com/400x220?text=No+Image" class="card-img-top" alt="No Image" style="height: 220px; object-fit: cover;">
          {% endif %}
          <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold text-success">{{ tree.name }}</h5>
            <p class="card-text text-muted flex-grow-1">{{ tree.tree_description|truncatewords:20 }}</p>
            <a href="{% url 'tree_detail' tree.pk %}" class="btn btn-outline-success rounded-pill mt-2 align-self-start">Read More <i class="bi bi-arrow-right-short"></i></a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-center py-5">
    <i class="bi bi-tree" style="font-size: 3rem; color: #2d6a4f;"></i>
    <p class="mt-3 text-muted fs-5">No trees found matching your search.</p>
  </div>
{% endif %}
