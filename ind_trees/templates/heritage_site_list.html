{% extends 'base.html' %}
{% block content %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Sites</title>
    <style>
        /* General Body Styles */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f7fc;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Container for centering content */
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Heading Styles */
        .page-heading {
            text-align: center;
            font-size: 2em;
            color: #2b7a77;
            margin-bottom: 40px;
            font-weight: bold;
        }

        /* Heritage Sites List */
        .heritage-sites-list {
            padding: 0;
            list-style-type: none;
            margin-top: 20px;
        }

        .heritage-site-item {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .heritage-site-item:hover {
            transform: translateY(-8px);
        }

        .heritage-site-item a {
            text-decoration: none;
            color: #2b7a77;
            font-size: 1.2em;
            font-weight: bold;
            display: block;
        }

        .heritage-site-item a:hover {
            color: #4caf50;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .page-heading {
                font-size: 1.5em;
                margin-bottom: 30px;
            }

            .heritage-site-item {
                padding: 10px;
            }

            .heritage-site-item a {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <div class="content-container">
        <h1 class="page-heading">Heritage Sites</h1>

        <!-- Heritage Sites List -->
        <ul class="heritage-sites-list">
            {% for site in heritage_sites %}
                <li class="heritage-site-item">
                    <a href="{% url 'heritage_site_detail' site.id %}">{{ site.name }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
{% endblock %}
