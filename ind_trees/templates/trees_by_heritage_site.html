
<!DOCTYPE html>
<html>
<head>
    <title>Trees at {{ heritage_site.name }}</title>
</head>
<body>
    <h1>Trees at {{ heritage_site.name }}</h1>
    <ul>
        {% for tree in trees %}

        {% endfor %}
    </ul>
</body>
</html>
